<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gestione studenti | Ali per la Libertà</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="admin.css"></head><body>
<header class="topbar"><a class="brand" href="/"><img src="/logo.png" alt="Logo Ali per la Libertà"><span>Ali per la Libertà</span></a><a class="install-button admin-back" href="../">Area studenti</a></header>
<section class="welcome"><div class="welcome-inner"><p class="eyebrow">Area insegnante</p><h1>Gestione studenti</h1><p>Assegna livello e lingua dei materiali.</p><a class="primary-button" href="/quiz-italiano/admin/">Risultati test finali</a></div></section>
<main class="page admin-page"><section class="auth-card" data-admin-login><h2>Accesso insegnante</h2><form data-admin-login-form><label>Username<input name="identifier" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Accedi</button><p class="message" data-admin-login-message></p></form></section>
<section data-admin-dashboard hidden><div class="dashboard-head"><div><p class="eyebrow">Iscrizioni</p><h2>Studenti registrati</h2></div><div class="admin-actions"><a class="primary-button" href="/quiz-italiano/admin/">Risultati test finali</a><button class="outline-button" data-refresh type="button">Aggiorna</button><button class="outline-button" data-admin-logout type="button">Esci</button></div></div><p class="message" data-admin-message></p><div class="student-list" data-students></div></section></main>
<footer>Area riservata all’insegnante.</footer><script src="admin.js"></script></body></html>
