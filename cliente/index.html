<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Area clienti - Ali Per La Liberta</title>
  <meta name="description" content="Area clienti Ali Per La Liberta." />
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="page portal-page">
    <header class="portal-header">
      <a class="portal-brand" href="/" aria-label="Ali Per La Liberta Home">
        <img src="/logo.png" alt="" decoding="async" />
        <span>Ali Per La Liberta</span>
      </a>
      <nav class="portal-nav" aria-label="Area riservata">
        <a href="/">Sito</a>
        <a href="/admin/" rel="nofollow">Admin</a>
      </nav>
    </header>

    <main class="portal-main">
      <section class="portal-hero" aria-labelledby="portalTitle">
        <p class="portal-eyebrow">Area clienti</p>
        <h1 id="portalTitle">Le tue richieste</h1>
        <p>Accedi per inviare una richiesta e seguire lo stato delle pratiche.</p>
      </section>

      <section id="authPanel" class="portal-auth" aria-label="Accesso clienti">
        <div class="portal-tabs" role="tablist" aria-label="Accesso o registrazione">
          <button type="button" class="portal-tab is-active" data-auth-tab="login">Login</button>
          <button type="button" class="portal-tab" data-auth-tab="register">Primo accesso</button>
        </div>

        <div class="portal-social" aria-label="Primo accesso rapido">
          <p id="oauthMessage" class="portal-message" role="status"></p>
          <a id="googleAccess" class="portal-social-button is-disabled" href="#" aria-disabled="true">
            <span>G</span>
            Continua con Google
          </a>
          <a id="appleAccess" class="portal-social-button is-disabled" href="#" aria-disabled="true">
            <span>Apple</span>
            Continua con Apple
          </a>
        </div>

        <form id="loginForm" class="portal-panel portal-form" autocomplete="on">
          <h2>Login cliente</h2>
          <label>
            Username o email
            <input name="identifier" type="text" autocomplete="username" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary portal-submit" type="submit">Entra</button>
          <p id="loginMessage" class="portal-message" role="status"></p>
        </form>

        <form id="registerForm" class="portal-panel portal-form" autocomplete="on" hidden>
          <h2>Primo accesso manuale</h2>
          <label>
            Nome e cognome
            <input name="name" type="text" autocomplete="name" required />
          </label>
          <label>
            Username
            <input name="username" type="text" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" required />
          </label>
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            Telefono
            <input name="phone" type="tel" autocomplete="tel" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="new-password" minlength="10" required />
          </label>
          <button class="btn btn-primary portal-submit" type="submit">Crea account</button>
          <p id="registerMessage" class="portal-message" role="status"></p>
        </form>
      </section>

      <section id="dashboardPanel" class="portal-dashboard" hidden>
        <div class="portal-dashboard-head">
          <div>
            <p class="portal-eyebrow">Cliente</p>
            <h2 id="clientName">Area clienti</h2>
          </div>
          <button id="logoutButton" class="btn btn-outline" type="button">Esci</button>
        </div>

        <div class="portal-grid">
          <form id="requestForm" class="portal-panel portal-form">
            <h2>Nuova richiesta</h2>
            <label>
              Servizio
              <select name="service" required>
                <option value="CAF">CAF</option>
                <option value="Patronato">Patronato</option>
                <option value="Assistenza legale">Assistenza legale</option>
                <option value="Corso italiano">Corso italiano</option>
                <option value="Altro">Altro</option>
              </select>
            </label>
            <label>
              Oggetto
              <input name="subject" type="text" maxlength="160" required />
            </label>
            <label>
              Messaggio
              <textarea name="message" rows="6" maxlength="3000" required></textarea>
            </label>
            <div class="portal-two">
              <label>
                Data preferita
                <input name="preferredDate" type="date" />
              </label>
              <label>
                Ora preferita
                <input name="preferredTime" type="time" />
              </label>
            </div>
            <label>
              Telefono per questa richiesta
              <input name="phone" type="tel" autocomplete="tel" />
            </label>
            <button class="btn btn-primary portal-submit" type="submit">Invia richiesta</button>
            <p id="requestMessage" class="portal-message" role="status"></p>
          </form>

          <section class="portal-panel portal-list-panel" aria-labelledby="requestsTitle">
            <div class="portal-list-head">
              <h2 id="requestsTitle">Richieste inviate</h2>
              <button id="refreshRequests" class="portal-icon-button" type="button" aria-label="Aggiorna">&#8635;</button>
            </div>
            <div id="requestsList" class="portal-list"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/config.js?v=20260710-portal1"></script>
  <script src="/js/portalClient.js?v=20260710-portal1" defer></script>
</body>
</html>
